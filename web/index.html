<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORYX7 — AI Runtime</title>
<meta name="description" content="NORYX7 — interfaccia web del runtime AI.">
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2ff;background:#080b12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172033 0,#080b12 48%);display:flex;flex-direction:column}.top{padding:18px 22px;border-bottom:1px solid #20283a;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:.08em}.status{font-size:13px;color:#9fe6b8}.shell{width:min(900px,100%);margin:auto;padding:28px 18px;display:flex;flex-direction:column;gap:18px;flex:1}.intro{padding:24px 4px 8px}.intro h1{font-size:clamp(30px,6vw,54px);margin:0 0 8px}.intro p{color:#aab4c8;margin:0}.identity{font-size:12px;color:#8491a8;border:1px solid #252e42;border-radius:12px;padding:10px 12px;background:#0d121c}.chat{display:flex;flex-direction:column;gap:12px;flex:1}.msg{max-width:86%;padding:13px 16px;border:1px solid #252e42;border-radius:16px;line-height:1.5;white-space:pre-wrap}.user{align-self:flex-end;background:#172238}.assistant{align-self:flex-start;background:#0e1420}.loading-offer{align-self:flex-start;max-width:86%;padding:12px 14px;border:1px solid #34405a;border-radius:14px;background:#101827;font-size:12px;color:#aeb9ce}.loading-offer a{color:#eef2ff;font-weight:700}.composer{display:flex;gap:10px;position:sticky;bottom:12px}.composer textarea{flex:1;resize:none;min-height:54px;max-height:180px;padding:15px;border-radius:15px;border:1px solid #303a50;background:#0d121c;color:#fff;font:inherit;outline:none}.composer button{border:0;border-radius:15px;padding:0 22px;background:#eef2ff;color:#080b12;font-weight:700;cursor:pointer}.composer button:disabled{opacity:.5;cursor:wait}.error{color:#ff9d9d;font-size:13px}.meta{font-size:11px;color:#71809a}.foot{font-size:11px;color:#66728a;text-align:center;padding-bottom:6px}@media(max-width:600px){.shell{padding:18px 12px}.msg{max-width:94%}.loading-offer{max-width:94%}.composer{gap:7px}.composer button{padding:0 15px}}
</style>
</head>
<body>
<header class="top"><div class="brand">NORYX7</div><div id="status" class="status">● online</div></header>
<main class="shell">
<section class="intro"><h1>NORYX7</h1><p>Interfaccia del runtime operativo. Ogni richiesta passa dal gateway canonico, dal kernel e dai confini di autorizzazione e verifica.</p></section>
<div id="identity" class="identity">Identità di sistema: verifica…</div>
<section id="chat" class="chat" aria-live="polite"></section>
<div id="error" class="error" hidden></div>
<form id="composer" class="composer"><textarea id="input" aria-label="Messaggio" placeholder="Scrivi a NORYX7…" required></textarea><button id="send" type="submit">Invia</button></form>
<div class="foot">NORYX7 Runtime · HTTPS API · Primary / Secondary · Gateway canonical path</div>
</main>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('composer'),input=document.getElementById('input'),send=document.getElementById('send'),error=document.getElementById('error'),identity=document.getElementById('identity');
function add(text,kind,meta=''){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;chat.appendChild(el);if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;chat.appendChild(m)}el.scrollIntoView({behavior:'smooth',block:'end'});}
function showLoadingOffer(offer){if(!offer||!offer.enabled||!offer.destination)return null;const box=document.createElement('div');box.className='loading-offer';box.innerHTML=`<span>${offer.label||'Sponsored'} · mentre NORYX7 prepara la risposta</span> · <a href="${offer.destination}" target="_blank" rel="noopener noreferrer sponsored">Apri</a>`;chat.appendChild(box);box.scrollIntoView({behavior:'smooth',block:'end'});return box;}
async function loadIdentity(){try{const r=await fetch('/api/identity',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();identity.textContent=`Sistema: ${data.system_id} · Creatore: ${data.creator} · Provenienza: ${data.provenance}`;}catch(err){identity.textContent='Identità di sistema non disponibile';}}
loadIdentity();
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;error.hidden=true;add(message,'user');input.value='';send.disabled=true;send.textContent='…';let offerBox=null;try{try{const offerResponse=await fetch('/api/monetization/loading-offer',{cache:'no-store'});if(offerResponse.ok)offerBox=showLoadingOffer(await offerResponse.json());}catch{}const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`HTTP ${r.status}`);if(offerBox)offerBox.remove();const states=(data.agent_runtime||[]).map(x=>`${x.agent_id}:${x.state}`).join(' · ');const meta=[data.execution_id?`execution: ${data.execution_id}`:'',data.system_id?`system: ${data.system_id}`:'',data.creator?`creator: ${data.creator}`:'',states].filter(Boolean).join(' · ');add(data.response,'assistant',meta);}catch(err){if(offerBox)offerBox.remove();error.textContent='Errore: '+err.message;error.hidden=false;}finally{send.disabled=false;send.textContent='Invia';input.focus();}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script>
</body>
</html>

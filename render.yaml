services:
  - type: web
    name: noryx7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web/serve.py
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NORYX_GATEWAY_BOOTSTRAP_TOKEN
        sync: false
      - key: NORYX_GATEWAY_SIGNING_SECRET
        sync: false
      - key: NORYX_BROWSER_PAIRING_CODE
        sync: false
      - key: NORYX7_WEB_RESEARCH_ENABLED
        sync: false
      - key: NORYX_SPONSORED_LOADING_URL
        sync: false

name: frontier-integrated-patch
on:
  push:
    branches:
      - frontier-integrated-2026-09-08
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integrated architecture patch
        run: python tools/apply_frontier_integration.py
      - name: Verify full suite
        run: python -m pytest -q
      - name: Commit integrated architecture
        run: |
          rm -f .github/workflows/frontier-integration.yml tools/apply_frontier_integration.py
          git config user.name "NORYX7 Integration"
          git config user.email "noryx7@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: integrate web research and dual-agent NORYX7 runtime"
          git push origin HEAD:frontier-integrated-2026-09-08

name: NORYX7 Bubblewrap integration

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noryx7-bubblewrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bubblewrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bubblewrap and process-limit utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Verify sandbox utilities
        run: |
          command -v bwrap
          command -v prlimit
          command -v setpriv
          bwrap --version
      - name: Run real Bubblewrap namespace, network, workspace and resource-limit test
        env:
          NORYX7_RUN_BWRAP_E2E: "1"
        run: python -m pytest -q core/test_os_sandbox_e2e.py

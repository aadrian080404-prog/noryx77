name: Component Verification

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jarvis:
    name: JARVIS unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest jarvis/tests -q

  browser:
    name: NORYX Browser unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noryx-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - run: gradle test --no-daemon

name: NORYX7 tests

on:
  push:
    branches:
      - main
      - frontier-hardening-2026-09-07
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest python-chess
      - name: Compile
        run: python -m compileall -q core noryx7_runtime jarvis web
      - name: Test
        run: pytest -q

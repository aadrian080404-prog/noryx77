name: NORYX7 Unified MVP Verification

on:
  push:
    branches:
      - integration-wave-10-end-to-end-closure-2026-09-10
  workflow_dispatch:
    inputs:
      cases:
        description: Deterministic generated verification cases
        required: false
        default: "1000000"
      seed:
        description: Deterministic campaign seed
        required: false
        default: "20260906"

permissions:
  contents: read

jobs:
  unified-mvp:
    name: Integrated runtime + full suite + security + million-scale
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CASES: ${{ inputs.cases || '1000000' }}
      SEED: ${{ inputs.seed || '20260906' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest python-chess
      - name: Compile entire runtime
        run: |
          set -euo pipefail
          python -m compileall -q core noryx7_runtime ecosystem jarvis web tests
      - name: Runtime integration and full suite
        run: |
          set -euo pipefail
          python -m pytest core noryx7_runtime ecosystem jarvis tests -q
      - name: Security and runtime binding audit
        run: |
          set -euo pipefail
          test "$(grep -RInE '(^|[^[:alnum:]_])(eval|exec)[[:space:]]*\(' core noryx7_runtime ecosystem jarvis web || true | wc -l)" -eq 0
          test "$(grep -RInE 'shell[[:space:]]*=[[:space:]]*True|os\.system[[:space:]]*\(|subprocess\.system[[:space:]]*\(' core noryx7_runtime ecosystem jarvis web || true | wc -l)" -eq 0
          test "$(grep -RInE '^[[:space:]]*except[[:space:]]*:[[:space:]]*$' core noryx7_runtime ecosystem jarvis web || true | wc -l)" -eq 0
          python -c 'from pathlib import Path; required=["core/tools.py","core/hypersynth_runtime.py","core/runtime.py","noryx7_runtime/engine.py","core/hypersynth.py","core/jarvis_runtime_bridge.py"]; [Path(x).is_file() or (_ for _ in ()).throw(SystemExit("missing_required_runtime_file:"+x)) for x in required]; ["RuntimeEngine" in Path(x).read_text() or (_ for _ in ()).throw(SystemExit("runtime_engine_binding_missing:"+x)) for x in ("core/tools.py","core/runtime.py","core/hypersynth_runtime.py")]'
          echo SECURITY_AND_RUNTIME_BINDING_AUDIT_PASS
      - name: Million-scale deterministic verification
        run: |
          set -euo pipefail
          python -m tests.million_scale_campaign --cases "$CASES" --seed "$SEED" | tee million-scale-result.json
      - name: Publish verification evidence
        if: always()
        run: |
          {
            echo "## NORYX7 unified MVP verification"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Cases: $CASES"
            echo "- Seed: $SEED"
            echo ""
            echo 'JSON_RESULT_START'
            cat million-scale-result.json 2>/dev/null || true
            echo 'JSON_RESULT_END'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload million-scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noryx7-unified-mvp-${{ github.run_id }}
          path: million-scale-result.json
          if-no-files-found: ignore

name: NORYX7 Generated Scenario Verification

on:
  push:
    branches: ["architecture-freeze-2026-09-06"]
  pull_request:
  workflow_dispatch:
    inputs:
      cases:
        description: Generated scenarios (maximum 1000000)
        required: false
        default: "1000000"
      seed:
        description: Deterministic campaign seed
        required: false
        default: "20260906"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  generated-scenarios:
    name: Generated scenario verification — ${{ github.event_name == 'pull_request' && '10000' || inputs.cases || '1000000' }} cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Validate campaign bounds
        env:
          CASES: ${{ github.event_name == 'pull_request' && '10000' || inputs.cases || '1000000' }}
          SEED: ${{ inputs.seed || '20260906' }}
        run: |
          set -euo pipefail
          [[ "$CASES" =~ ^[1-9][0-9]*$ ]]
          [[ "$SEED" =~ ^[0-9]+$ ]]
          (( CASES <= 1000000 ))
          (( SEED <= 9223372036854775807 ))
      - name: Run generated-scenario campaign
        env:
          CASES: ${{ github.event_name == 'pull_request' && '10000' || inputs.cases || '1000000' }}
          SEED: ${{ inputs.seed || '20260906' }}
        run: |
          set -euo pipefail
          python -m tests.million_scale_campaign --cases "$CASES" --seed "$SEED" | tee generated-scenario-result.json
      - name: Publish campaign evidence
        if: always()
        run: |
          {
            echo "## NORYX7 generated-scenario verification"
            echo ""
            echo "Scope: one structural preflight plus deterministic synthetic scenario invariants; this is not one million live runtime executions."
            echo ""
            echo ' ```json'
            cat generated-scenario-result.json 2>/dev/null || true
            echo ' ```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noryx7-generated-scenarios-${{ github.run_id }}
          path: generated-scenario-result.json
          if-no-files-found: ignore

name: NORYX7 Million-Scale Verification

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Generated scenarios
        required: false
        default: "1000000"
      seed:
        description: Deterministic campaign seed
        required: false
        default: "20260906"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  million-scale:
    name: Generated verification — ${{ inputs.cases || '1000000' }} cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run generated campaign
        env:
          CASES: ${{ inputs.cases || '1000000' }}
          SEED: ${{ inputs.seed || '20260906' }}
        run: |
          set -euo pipefail
          python -m tests.million_scale_campaign --cases "$CASES" --seed "$SEED" | tee million-scale-result.json
      - name: Publish campaign evidence
        if: always()
        run: |
          {
            echo "## NORYX7 million-scale verification"
            echo ""
            echo '```json'
            cat million-scale-result.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noryx7-million-scale-${{ github.run_id }}
          path: million-scale-result.json
          if-no-files-found: ignore
